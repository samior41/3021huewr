<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 홈페이지 명은 title 안의 글자를 수정해주세요. -->
  <title>ENTY</title>
  <script id="enty-theme-boot">
    (function () {
      var root = document.documentElement;
      function readable(hex) {
        var f = function (i) {
          var v = parseInt(hex.substr(i, 2), 16) / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        var L = 0.2126 * f(1) + 0.7152 * f(3) + 0.0722 * f(5);
        return 1.05 / (L + 0.05) >= (L + 0.05) / 0.0567 ? "#ffffff" : "#0d141d";
      }
      try {
        var hash = (location.hash.match(/theme=([^&]+)/) || [])[1];
        var raw = hash
          ? atob(decodeURIComponent(hash))
          : localStorage.getItem("enty-theme") || "{}";
        var state = JSON.parse(raw) || {};
        var mode = state.mode || "auto";
        if (mode === "auto") {
          mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.setAttribute("data-theme", mode);
        var custom = (state.custom || {})[mode] || {};
        for (var key in custom) {
          if (!/^#[0-9a-f]{6}$/i.test(custom[key])) continue;
          root.style.setProperty("--accent-" + key, custom[key]);
          if (key === "char1" || key === "char2") {
            root.style.setProperty("--on-" + key, readable(custom[key]));
          }
        }
      } catch (e) {
      }
      try {
        var saved = JSON.parse(localStorage.getItem("enty-avatars") || "{}");
        var rules = "";
        var accounts = {"char1":"@A_0044","char2":"@O_Hayne"};
        for (var name in accounts) {
          var gen = root.getAttribute("data-gen-" + name);
          var url = gen && saved[name + ":" + gen];
          if (!url || url.slice(0, 11) !== "data:image/") continue;
          var at = '.ttobot-status[data-account="' + accounts[name] + '"] .ttobot-avatar';
          rules += at + '{background-image:url("' + url + '");background-size:cover;background-position:center}';
          rules += at + " img{visibility:hidden}";
        }
        if (rules) {
          var style = document.createElement("style");
          style.id = "enty-avatar-style";
          style.textContent = rules;
          document.head.appendChild(style);
        }
      } catch (e) {
      }
      try {
        if (window.self !== window.top) root.classList.add("in-pane");
      } catch (e) {
        root.classList.add("in-pane");
      }
    })();
  </script>
  <link rel="stylesheet" href="style/ttobot.css">
</head>
<body class="reader-page">
  <div class="reader" id="reader" data-open="false">

    <aside class="reader-side" data-character="char1" data-side="left">
      <button type="button" class="reader-portrait" data-portrait="char1"
              aria-label="제일린 리우 이미지 바꾸기"></button>
      <div class="reader-name"><b data-name="char1">제일린 리우</b></div>
      <div class="reader-scroll" data-list="char1"></div>
    </aside>

    <main class="reader-center">
      <header class="reader-banner">
        <button type="button" class="reader-banner-image" data-banner
                aria-label="헤더 이미지 바꾸기"></button>
        <button type="button" class="reader-pair" id="reader-pair"
                aria-label="페어명 수정">ENTY</button>
      </header>

      <div class="reader-search-slot"></div>

      <div class="reader-thread">
        <div class="reader-thread-head">
          <button type="button" class="reader-back" id="reader-back">← 목록</button>
          <h2 id="reader-title">스레드</h2>
          <span id="reader-sub"></span>
        </div>
        <div class="reader-empty" id="reader-empty">양쪽에서 대화를 고르면 여기에 열립니다.</div>
        <iframe class="reader-frame" id="reader-frame" title="대화 스레드" hidden></iframe>
      </div>
    </main>

    <aside class="reader-side" data-character="char2" data-side="right">
      <button type="button" class="reader-portrait" data-portrait="char2"
              aria-label="해나 라스커 이미지 바꾸기"></button>
      <div class="reader-name"><b data-name="char2">해나 라스커</b></div>
      <div class="reader-scroll" data-list="char2"></div>
    </aside>

  </div>

  <input type="file" accept="image/*" hidden id="reader-picker">

  <script src="search.js"></script>
  <script src="manifest.js"></script>
  <script src="reader.js"></script>
  <script src="theme.js"></script>
</body>
</html>
